<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Prince Ram">
        <title>Guest List</title>

        <style>
            body {
              font-family: Georgia, serif;
              max-width: 760px;
              margin: 0 auto;
              padding: 24px;
              color: #4a3d1a;
              background: #f4f7fe;
            }

            .tot {
              display: flex;
              gap: 12px;
              margin: 16px 0;
            }

            .tot div {
              flex: 1;
              background: #fff;
              border: 2px solid #c6ddfb;
              border-radius: 14px;
              padding: 14px;
              text-align: center;
            }

            .tot b {
              display: block;
              font-size: 1.8rem;
            }

            table {
              width: 100%;
              border-collapse: collapse;
              background: #fff;
             border-radius: 12px;
              overflow: hidden;
            }

            th,
            td {
              padding: 10px 12px;
              text-align: left;
              border-bottom: 1px solid #eee;
            }

        </style>
