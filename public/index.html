<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Prince Ram">
        <title>Prince's 21st Birthday</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">

        <style>
            :root {
              --blue: #c6ddfb;
              --gold: #8a6a1c;
              --sand: #f0ece1;
              --line: #b9a577;
            }

            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              font-family: Lora, Georgia, serif;
              color: var(--gold);
              background:
              repeating-linear-gradient(0deg, rgba(150, 175, 225, .28) 0 28px, transparent 28px 56px),
              repeating-linear-gradient(90deg, rgba(150, 175, 225, .28) 0 28px, transparent 28px 56px),
              #f4f7fe;
            }

            main {
              max-width: 520px;
              margin: 0 auto;
            }

            img.page {
              display: block;
              width: 100%;
              height: auto;
            }

            section.form {
             padding: 6vh 20px;
            }

            form {
              background: #fff;
              border: 4px solid var(--blue);
              border-radius: 28px;
              padding: 32px 26px;
            }
        



    </head>
</html>
