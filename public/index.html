<!Doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Prince Ram">
        <title>Prince's 21st Birthday</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">

        <style>
            :root {
              --blue: #c6ddfb;
              --gold: #8a6a1c;
              --sand: #f0ece1;
              --line: #b9a577;
            }

            * {
              box-sizing: border-box;
            }

            body {
              margin: 0;
              font-family: Lora, Georgia, serif;
              color: var(--gold);
              background:
              repeating-linear-gradient(0deg, rgba(150, 175, 225, .28) 0 28px, transparent 28px 56px),
              repeating-linear-gradient(90deg, rgba(150, 175, 225, .28) 0 28px, transparent 28px 56px),
              #f4f7fe;
            }

            main {
              max-width: 520px;
              margin: 0 auto;
            }

            img.page {
              display: block;
              width: 100%;
              height: auto;
            }

            section.form {
             padding: 6vh 20px;
            }

            form {
              background: #fff;
              border: 4px solid var(--blue);
              border-radius: 28px;
              padding: 32px 26px;
            }

            h1 {
              font-weight: 500;
              font-size: 2.1rem;
              margin: 0 0 20px;
            }

            label,
            legend {
              display: block;
              font-size: 1.05rem;
              margin: 22px 0 8px;
              padding: 0;
            }

            fieldset {
              border: 0;
              margin: 0;
              padding: 0;
            }

            input[type=text] {
              width: 100%;
              font: inherit;
              color: inherit;
              padding: 14px;
             border: 1.5px solid var(--line);
              border-radius: 12px;
              background: #fff;
            }

            .opt {
              display: block;
              margin: 0 0 10px;
            }

            .opt input {
              position: absolute;
              opacity: 0;
            }

            .opt span {
              display: block;
              padding: 15px 16px;
              background: var(--sand);
              border-radius: 12px;
              border: 2px solid transparent;
              cursor: pointer;
            }

            .opt input:checked + span {
              border-color: var(--gold);
              background: #e8dfc6;
            }
            

            



    </head>
</html>
